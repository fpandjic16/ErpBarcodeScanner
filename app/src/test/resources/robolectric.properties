# Defaults for every test that runs under Robolectric (DocumentRepositoryTest, UploadCoordinatorTest,
# MigrationTest). The plain JUnit tests do not read this file.
#
# Android 14, not the target SDK: it is well inside what Robolectric emulates and needs nothing
# newer than Java 17 to run.
sdk=34
# A bare Application instead of the app's own, which Hilt would have to build a component for.
# These tests construct what they need by hand.
application=android.app.Application
